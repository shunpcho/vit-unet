name: Lint Python

on: [push]
jobs:
  ruff-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up UV
        uses: astral-sh/setup-uv@v6

      - name: Run Ruff format
        run: uv run ruff format --check src/vit_unet/models src/vit_unet/config

      - name: Run Ruff check
        run: uv run ruff check src/vit_unet/models src/vit_unet/config

  typing-lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: Set up UV
        uses: astral-sh/setup-uv@v6

      - name: Run Pyright
        run: uv run pyright src/vit_unet/models src/vit_unet/config
